version: "3.9"

services:
  yooboo:
    build:
      context: .
      dockerfile: Dockerfile
    image: yooboo:latest
    container_name: yooboo
    ports:
      - "3000:3000"
    restart: unless-stopped
    # Uncomment to override ports if needed:
    # environment:
    #   - PORT=3000
    #   - NEXTJS_PORT=3001
    #   - GAME_SERVER_PORT=3002
