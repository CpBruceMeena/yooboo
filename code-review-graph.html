    gap: 7px;

    font-family: 'JetBrains Mono', monospace;

    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.06);

    height: 100vh;

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════

const container = document.getElementById('graph');
const network = new vis.Network(container, { nodes, edges }, options);

// Map node id → details for panel
const depMap = {};
edges.forEach(e => {
  if (!depMap[e.from]) depMap[e.from] = { exports: new Set(), imports: new Set() };
  if (!depMap[e.to]) depMap[e.to] = { exports: new Set(), imports: new Set() };
  depMap[e.from].exports.add(e.to);
  depMap[e.to].imports.add(e.from);
});

// ── Panel ──
function openPanel(nodeId) {
  const name = nodeId;
  const group = network.getNodes().get(nodeId).group;
  const cat = categories[group]?.label || '—';
  const desc = nodeDescriptions[nodeId] || 'No description available.';
  document.getElementById('dp-category').textContent = cat;
  document.getElementById('dp-name').textContent = name.split('/').pop();
  document.getElementById('dp-path').textContent = name;
  document.getElementById('dp-desc').textContent = desc;

  const deps = depMap[nodeId] || { exports: new Set(), imports: new Set() };

  const exportsEl = document.getElementById('dp-exports');
  exportsEl.innerHTML = '';
  if (deps.exports.size === 0) {
    exportsEl.innerHTML = '<span style="font-size:11px;color:rgba(232,220,200,0.2);">Leaf node (no dependents)</span>';
  } else {
    deps.exports.forEach(dep => {
      const chip = document.createElement('span');
      chip.className = 'dep-chip';
      chip.textContent = dep.split('/').pop();
      chip.onclick = () => { network.selectNodes([dep], false); openPanel(dep); };
      exportsEl.appendChild(chip);
    });
  }

  const importsEl = document.getElementById('dp-imports');
  importsEl.innerHTML = '';
  if (deps.imports.size === 0) {
    importsEl.innerHTML = '<span style="font-size:11px;color:rgba(232,220,200,0.2);">No internal imports</span>';
  } else {
    deps.imports.forEach(dep => {
      const chip = document.createElement('span');
      chip.className = 'dep-chip';
      chip.textContent = dep.split('/').pop();
      chip.onclick = () => { network.selectNodes([dep], false); openPanel(dep); };
      importsEl.appendChild(chip);
    });
  }

  document.getElementById('detail-panel').classList.add('open');
}

function closePanel() {
  document.getElementById('detail-panel').classList.remove('open');
  network.unselectAll();
}

network.on('click', (params) => {
  if (params.nodes.length > 0) {
    openPanel(params.nodes[0]);
  } else {
    closePanel();
  }
});

network.on('doubleClick', () => { closePanel(); });

// ── Search ──
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    const bar = document.getElementById('search-bar');
    bar.classList.toggle('visible');
    if (bar.classList.contains('visible')) {
      document.getElementById('search-input').focus();
    }
  }
  if (e.key === 'Escape') {
    document.getElementById('search-bar').classList.remove('visible');
    closePanel();
  }
});

document.getElementById('search-input').addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase().trim();
  if (!query) {
    nodes.forEach(n => { nodes.update({ id: n.id, opacity: 0.85 }); });
    return;
  }
  nodes.forEach(n => {
    const match = n.id.toLowerCase().includes(query) || n.label.toLowerCase().includes(query);
    nodes.update({ id: n.id, opacity: match ? 1 : 0.12 });
  });
});

// ── Stabilization finished → reset ──
network.once('stabilizationIterationsDone', () => {
  network.setOptions({ physics: { enabled: false } });
});

console.log('Code Review Graph loaded — 36 nodes, 89 edges');
