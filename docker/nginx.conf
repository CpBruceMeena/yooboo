# YOOBOO reverse proxy configuration (Docker)
# Listens on port 3000, routes:
#   /api/socketio/*  → Game Server (port 3002)
#   everything else  → Next.js frontend (port 3001)
#
# Self-contained — no external mime.types file dependency.

worker_processes auto;
error_log /dev/stderr warn;
# pid is set at runtime by the entrypoint script (-g flag)

events {
  worker_connections 1024;
}

http {
  # Inline common MIME types (avoids fragile /etc/nginx/mime.types path)
  types {
    text/html                                       html htm;
    text/css                                        css;
    text/javascript                                 js;
    application/json                                json;
    application/pdf                                 pdf;
    image/svg+xml                                   svg svgz;
    image/png                                       png;
    image/jpeg                                      jpeg jpg;
    image/gif                                       gif;
    image/webp                                      webp;
    image/x-icon                                    ico;
    font/woff                                       woff;
    font/woff2                                      woff2;
    font/ttf                                        ttf;
    application/wasm                                wasm;
    application/octet-stream                        bin;
    application/x-font-ttf                          ttc;
    text/xml                                        xml;
    text/plain                                      txt;
  }

  default_type  application/octet-stream;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  sendfile        on;
  keepalive_timeout 65;

  # Map upgrade header for WebSocket proxying
  map $http_upgrade $connection_upgrade {
    default  upgrade;
    ''       close;
  }

  server {
    listen       3000;
    server_name  localhost;

    # ── Socket.IO game server ──
    location /api/socketio {
      proxy_pass http://127.0.0.1:3002;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Increase timeouts for long-polling
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;

      # Disable buffering — Socket.IO long-polling needs real-time responses
      proxy_buffering off;
      proxy_buffer_size 4k;

      # Allow up to 30s for the initial connect/upgrade
      proxy_connect_timeout 30s;
    }

    # ── Next.js frontend (HMR WebSocket + all HTTP) ──
    location / {
      proxy_pass http://127.0.0.1:3001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Disable buffering for Server-Sent Events (Next.js)
      proxy_buffering off;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
